<!--
  템플릿 안에서는 ref가 자동으로 "언래핑"되기 때문에
  .value를 사용할 필요가 없습니다.
-->
<h1>{{ message }}</h1>

<!--
  메서드/함수에 바인딩합니다.
  @click 문법은 v-on:click의 축약형입니다.
-->
<button @click="reverseMessage">메시지 뒤집기</button>

<!-- 인라인 표현식 구문도 사용할 수 있습니다 -->
<button @click="message += '!'">"!" 추가</button>

<!--
  Vue는 e.preventDefault()나 e.stopPropagation()과 같은
  일반적인 작업을 위한 수정자도 제공합니다.
-->
<a href="https://vuejs.org" @click.prevent="notify">
  e.preventDefault()가 적용된 링크
</a>
