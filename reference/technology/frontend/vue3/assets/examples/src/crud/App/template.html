<div><input v-model="prefix" placeholder="접두사로 필터링"></div>

<select size="5" v-model="selected">
  <option v-for="name in filteredNames" :key="name">{{ name }}</option>
</select>

<label>이름: <input v-model="first"></label>

<div class="buttons">

  <button @click="update">수정</button>
  <button @click="del">삭제</button>
</div>
