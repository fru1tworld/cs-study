<p>
  <span :title="message">
    마우스를 몇 초 동안 이곳에 올려두면 동적으로 바인딩된 제목을 볼 수 있습니다!
  </span>
</p>

<!--
클래스 바인딩은 일반 문자열뿐만 아니라
객체와 배열도 특별히 지원합니다
-->
<p :class="{ red: isRed }" @click="toggleRed">
  이 텍스트는 빨간색이어야 합니다... 하지만 클릭하면 토글됩니다.
</p>

<!-- 스타일 바인딩도 객체와 배열을 지원합니다 -->
<p :style="{ color }" @click="toggleColor">
  이 텍스트는 초록색이어야 하며, 클릭 시 초록색과 파란색이 번갈아 나타납니다.
</p>
